name: Collect Basketly deals
on:
  schedule:
    - cron: "17 6,17 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: basketly-deal-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Collect offers
        run: npm run collect
        env:
          BASKETLY_PROXY_SERVER: ${{ secrets.BASKETLY_PROXY_SERVER }}
          BASKETLY_PROXY_USERNAME: ${{ secrets.BASKETLY_PROXY_USERNAME }}
          BASKETLY_PROXY_PASSWORD: ${{ secrets.BASKETLY_PROXY_PASSWORD }}
          COLES_BUILD_ID: ${{ secrets.COLES_BUILD_ID }}
      - name: Commit meaningful data changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: update Basketly supermarket deals"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger Pages deployment
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Deploy Basketly"
